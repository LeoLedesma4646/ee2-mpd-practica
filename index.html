<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EE2 · Práctica por rondas</title>
<style>
:root {
  color-scheme: light;
  --ink: #202428;
  --muted: #555d63;
  --rule: #dce0e2;
  --accent: #23675e;
  --accent-dark: #1a554d;
  --accent-soft: #edf6f3;
  --good-soft: #edf7f1;
  --bad-soft: #fff0ed;
  --good: #195e43;
  --bad: #ad4438;
  --bad-fill: #cf6d61;
  font-family: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: white; color: var(--ink); }
button, input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
.shell { width: min(calc(100% - 40px), 740px); margin: 0 auto; }
header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 11px 20px;
  padding: 35px 0 21px;
}
.course { margin: 0 0 4px; color: var(--muted); font-size: .88rem; }
h1 { margin: 0; font-size: clamp(1.65rem, 4.5vw, 2.15rem); letter-spacing: -.035em; line-height: 1.17; }
.bank-picker { display: flex; align-items: center; gap: 3px; }
.header-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; }
.account-link {
  background: white;
  border-color: transparent;
  color: var(--accent-dark);
  min-height: 36px;
  padding: 5px 8px;
  font-size: .86rem;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.account-link:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-dark); }
.account-sync { color: var(--muted); font-size: .81rem; }
.account-dialog {
  width: min(calc(100% - 30px), 410px);
  max-height: calc(100% - 30px);
  padding: 20px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  color: var(--ink);
  background: white;
}
.account-dialog::backdrop { background: rgb(32 36 40 / .26); }
.account-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.account-dialog h2 { margin: 0; font-size: 1.24rem; }
.account-dialog p { margin: 10px 0; line-height: 1.45; overflow-wrap: anywhere; }
.account-form { display: grid; gap: 12px; margin-top: 14px; }
.account-form label { display: grid; gap: 5px; font-size: .9rem; font-weight: 650; }
.account-form input { width: 100%; padding: 8px; border: 1px solid var(--rule); border-radius: 5px; }
.account-options { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; }
.account-notice { color: var(--accent-dark); font-size: .9rem; }
.account-notice[data-error='true'] { color: var(--bad); }
.bank-picker button {
  min-height: 36px;
  padding: 5px 9px;
  border-color: transparent;
  background: white;
  color: var(--muted);
  font-size: .86rem;
}
.bank-picker button:hover:not(:disabled) { background: #f5f9f8; color: var(--accent-dark); }
.bank-picker button[aria-pressed='true'],
.bank-picker button[aria-pressed='true']:hover:not(:disabled) {
  color: var(--accent-dark);
  background: var(--accent-soft);
}
.practice-progress {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr);
  padding-block: 14px;
  border-block: 1px solid var(--rule);
}
.progress-group { min-width: 0; }
.learning-progress { padding-right: 20px; }
.round-progress { padding-left: 20px; border-left: 1px solid var(--rule); }
.metric-line {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-bottom: 8px;
  font-size: .91rem;
  line-height: 1.35;
}
.metric-line span { color: var(--muted); font-variant-numeric: tabular-nums; }
#progress-label { color: var(--accent-dark); }
.quiz { padding: 23px 0 40px; }
.step { margin: 0 0 7px; color: var(--muted); font-size: .85rem; font-weight: 650; }
.progress-track {
  position: relative;
  display: flex;
  height: 6px;
  border-radius: 8px;
  overflow: hidden;
  background: #e7efed;
}
.progress-track progress {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
}
.progress-fill {
  display: block;
  flex: 0 0 auto;
  width: 0%;
  height: 100%;
  background: var(--accent);
  transition: width 240ms ease-out;
}
.round-correct { background: var(--good); }
.round-incorrect { background: var(--bad-fill); }
.round-breakdown {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 8px;
  color: var(--muted);
  font-size: .83rem;
  font-variant-numeric: tabular-nums;
}
.round-breakdown span { display: inline-flex; align-items: center; gap: 6px; }
.round-breakdown span::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
}
.round-breakdown #incorrect-label::before { background: var(--bad-fill); }
h2 {
  margin: 0 0 17px;
  max-width: 68ch;
  font-size: clamp(1.13rem, 3.2vw, 1.4rem);
  font-weight: 650;
  line-height: 1.42;
  overflow-wrap: anywhere;
}
h2:focus, .feedback:focus { outline: none; }
.context { margin: -4px 0 15px; padding-left: 25px; color: var(--muted); line-height: 1.5; }
.hint { margin: -5px 0 12px; color: var(--muted); font-size: .92rem; }
fieldset { min-width: 0; border: 0; padding: 0; margin: 0; }
.option {
  display: grid;
  grid-template-columns: 18px 1fr;
  align-items: start;
  gap: 12px;
  padding: 12px 4px;
  min-height: 45px;
  border-bottom: 1px solid var(--rule);
  line-height: 1.42;
  cursor: pointer;
  transition: background-color 130ms ease;
}
.option:first-child { border-top: 1px solid var(--rule); }
fieldset:not(:disabled) .option:hover { background: #f5f9f8; }
fieldset:not(:disabled) .option:has(input:checked) { background: var(--accent-soft); }
.option input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); }
.option .letter { color: var(--muted); font-weight: 650; margin-right: .45em; }
fieldset:disabled .option { cursor: default; }
fieldset:disabled .option.is-correct { color: var(--good); background: var(--good-soft); }
fieldset:disabled .option.is-wrong { color: var(--bad); background: var(--bad-soft); }
fieldset:disabled .option.is-correct .letter,
fieldset:disabled .option.is-wrong .letter { color: inherit; }
.response {
  margin-top: 17px;
  display: flex;
  align-items: start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.response > button { margin-left: auto; }
button {
  border: 1px solid var(--accent);
  border-radius: 5px;
  padding: 9px 14px;
  min-height: 42px;
  color: white;
  background: var(--accent);
  font-weight: 650;
  cursor: pointer;
  transition: background-color 140ms ease, transform 120ms ease;
}
button:hover:not(:disabled) { background: var(--accent-dark); }
button:active:not(:disabled) { transform: translateY(1px) scale(.98); }
button:disabled {
  border-color: var(--rule);
  color: #626a70;
  background: white;
  cursor: default;
}
.feedback {
  flex: 1 1 300px;
  margin: 0;
  padding: 8px 10px;
  border-radius: 5px;
  font-size: .92rem;
  line-height: 1.5;
}
.feedback.good { color: var(--good); --feedback-flash: #e3f3e9; }
.feedback.bad { color: var(--bad); --feedback-flash: #fceae5; }
.feedback-title { display: flex; align-items: center; gap: 8px; }
.feedback strong { font-size: 1rem; }
.feedback-icon {
  display: inline-grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  font-weight: 700;
}
.feedback.good .feedback-icon { background: var(--good-soft); }
.feedback.bad .feedback-icon { background: var(--bad-soft); }
.feedback p { margin: 4px 0 0; color: var(--ink); }
.feedback .explanation { margin-top: 7px; }
.feedback a { color: var(--accent-dark); font-size: .85rem; text-underline-offset: .15em; }
.feedback a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.feedback-enter { animation: feedback-in 235ms ease-out both; }
.question-enter { animation: question-in 150ms ease-out both; }
@keyframes feedback-in {
  from { background-color: var(--feedback-flash); opacity: .65; transform: translateY(4px); }
  to { background-color: transparent; opacity: 1; transform: translateY(0); }
}
@keyframes question-in {
  from { opacity: .55; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .progress-fill, .option, button { transition: none; }
  button:active:not(:disabled) { transform: none; }
  .feedback-enter, .question-enter { animation: none; }
}
[hidden] { display: none !important; }
.question-toolbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 16px;
  margin-bottom: 8px;
}
.question-toolbar .step { margin: 0; }
.question-position { display: flex; align-items: center; gap: 7px; }
.previous-question {
  display: inline-grid;
  place-items: center;
  width: 34px;
  min-height: 34px;
  padding: 0;
  border-color: transparent;
  background: white;
  color: var(--accent-dark);
  font-size: 1.2rem;
  line-height: 1;
}
.previous-question:hover:not(:disabled) { background: var(--accent-soft); }

.learn-link, .study-back {
  color: var(--accent-dark);
  font-size: .88rem;
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: .2em;
}
.learn-link { padding: 6px 0 6px 8px; white-space: nowrap; }
.learn-link:active, .study-back:active { opacity: .72; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.study-page { padding: 20px 0 45px; }
.study-meta { margin: 17px 0 6px; color: var(--muted); font-size: .85rem; }
.study-page h2 { margin: 0 0 7px; font-size: clamp(1.45rem, 4vw, 1.9rem); }
.study-insight { margin: 0; max-width: 66ch; line-height: 1.52; }
.study-glossary { margin: 10px 0 0; font-size: .86rem; line-height: 1.45; color: var(--muted); }
.study-original { margin: 12px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }
.study-original strong { color: var(--ink); }
.study-original p { margin: 6px 0 0; }
.study-figure {
  margin: 14px 0 0;
  padding: 11px 13px;
  border: 1px solid var(--rule);
  border-radius: 6px;
}
.figure-title { display: block; margin-bottom: 8px; font-size: .92rem; }
.study-figure figcaption { margin-top: 8px; color: var(--muted); font-size: .87rem; line-height: 1.45; }
.study-table { width: 100%; border-collapse: collapse; font-size: .88rem; line-height: 1.4; }
.study-table th, .study-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}
.study-table thead th { color: var(--accent-dark); background: var(--accent-soft); }
.study-table tbody th { font-weight: 650; }
.study-steps {
  display: grid;
  grid-template-columns: repeat(var(--step-count), minmax(0, 1fr));
  margin: 0;
  padding: 0;
  gap: 20px;
  list-style: none;
}
.study-steps li {
  position: relative;
  display: grid;
  align-content: center;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid #dce9e5;
  border-radius: 4px;
  background: var(--accent-soft);
  font-size: .85rem;
  line-height: 1.38;
  overflow-wrap: anywhere;
}
.study-steps li + li::before {
  position: absolute;
  top: 50%;
  left: -18px;
  content: "→";
  transform: translateY(-50%);
  color: var(--accent);
  font-weight: 700;
}
.study-map {
  --map-line: #83a69d;
  display: grid;
  justify-items: center;
  padding-top: 2px;
}
.map-root {
  position: relative;
  display: inline-block;
  padding: 6px 11px;
  border-radius: 4px;
  background: var(--accent);
  color: white;
  font-size: .9rem;
  line-height: 1.35;
  font-weight: 650;
}
.map-root::after {
  position: absolute;
  top: 100%;
  left: 50%;
  height: 13px;
  border-left: 1px solid var(--map-line);
  content: "";
}
.map-branches {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(var(--branch-count), minmax(0, 1fr));
  margin: 24px 0 0;
  padding: 0;
  list-style: none;
  column-gap: 12px;
}
.map-branches li {
  position: relative;
  min-width: 0;
  padding: 6px 9px;
  border: 1px solid #dce9e5;
  border-radius: 4px;
  background: var(--accent-soft);
  font-size: .85rem;
  line-height: 1.38;
  overflow-wrap: anywhere;
}
.map-branches li::before,
.map-branches li::after {
  position: absolute;
  content: "";
  pointer-events: none;
}
.map-branches li::before {
  bottom: 100%;
  left: 50%;
  height: 12px;
  border-left: 1px solid var(--map-line);
}
.map-branches li::after {
  bottom: calc(100% + 12px);
  left: -7px;
  right: -7px;
  border-top: 1px solid var(--map-line);
}
.map-branches li:first-child::after { left: 50%; }
.map-branches li:last-child::after { right: 50%; }
.map-branches strong { display: block; color: var(--accent-dark); }
.study-bars { display: grid; gap: 9px; font-size: .86rem; }
.study-bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 1fr) minmax(80px, 1.6fr) max-content;
  align-items: center;
  gap: 8px;
}
.study-bar-track { height: 9px; border-radius: 3px; background: #e7efed; overflow: hidden; }
.study-bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.study-bar-row strong { min-width: 2.4em; font-variant-numeric: tabular-nums; }
.study-numberline {
  position: relative;
  height: 61px;
  margin: 14px 31px 0;
  padding: 0;
  list-style: none;
  font-size: .82rem;
}
.study-numberline::before {
  position: absolute;
  top: 21px;
  width: 100%;
  border-top: 1px solid #83a69d;
  content: "";
}
.study-numberline li {
  position: absolute;
  top: 4px;
  display: grid;
  justify-items: center;
  gap: 1px;
  transform: translateX(-50%);
  white-space: nowrap;
}
.study-numberline li::before {
  grid-row: 2;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
}
.study-numberline li:nth-child(2) strong { color: var(--accent-dark); }
.study-numberline li:nth-child(2)::before {
  outline: 2px solid #add2c7;
  outline-offset: 2px;
}
.study-table-support { margin: 18px 0 0; }
.study-table-support h3 { margin: 0 0 7px; font-size: .92rem; }
.study-table-support p { margin: 7px 0 0; color: var(--muted); font-size: .87rem; line-height: 1.4; }
@media (max-width: 560px) {
  .study-steps { grid-template-columns: 1fr; gap: 17px; }
  .study-steps li + li::before { top: -17px; left: 11px; transform: none; content: "↓"; }
  .study-map { justify-items: start; }
  .map-root::after { left: 14px; height: 13px; }
  .map-branches {
    position: relative;
    grid-template-columns: 1fr;
    gap: 7px;
    margin-top: 10px;
    padding-left: 27px;
  }
  .map-branches::before {
    position: absolute;
    top: 0;
    bottom: 15px;
    left: 14px;
    border-left: 1px solid var(--map-line);
    content: "";
  }
  .map-branches li::before {
    left: -14px;
    top: 15px;
    bottom: auto;
    width: 13px;
    height: 0;
    border-left: 0;
    border-top: 1px solid var(--map-line);
  }
  .map-branches li::after { display: none; }
}
.study-chart { display: block; width: min(100%, 440px); height: auto; }
.study-source { display: inline-block; margin-top: 9px; font-size: .86rem; color: var(--accent-dark); }
@media (max-width: 560px) {
  .study-page { padding-top: 13px; }
}
.summary h2 { margin-bottom: 8px; font-size: clamp(1.35rem, 4vw, 1.8rem); letter-spacing: -.025em; }
.summary p { max-width: 55ch; line-height: 1.55; }
.summary button { margin-top: 8px; }
.completion-mark {
  position: relative;
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin: 3px 0 14px;
}
.completion-check {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border: 1px solid #c4ded3;
  border-radius: 50%;
  background: var(--good-soft);
  color: var(--good);
  font-size: 1.85rem;
  line-height: 1;
}
.completion-spark {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 7px;
  border-radius: 1px;
  background: var(--spark-color);
  opacity: 0;
  pointer-events: none;
}
.celebrating .completion-check { animation: reward-check 430ms cubic-bezier(.22,.79,.35,1) both; }
.celebrating .completion-spark { animation: reward-spark 690ms ease-out both; }
@keyframes reward-check {
  0% { opacity: 0; transform: scale(.72); }
  64% { opacity: 1; transform: scale(1.07); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes reward-spark {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.45); }
  19% { opacity: .85; }
  100% { opacity: 0; transform: translate(var(--spark-x), var(--spark-y)) rotate(var(--spark-turn)); }
}
.completion-summary .completion-question { margin: 12px 0 6px; }
.completion-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.completion-actions .quiet-button {
  background: white;
  color: var(--accent-dark);
  border-color: var(--rule);
}
.completion-actions .quiet-button:hover:not(:disabled) { background: var(--accent-soft); }
@media (prefers-reduced-motion: reduce) {
  .celebrating .completion-check, .celebrating .completion-spark { animation: none; }
}

@media (max-width: 560px) {
  .shell { width: calc(100% - 30px); }
  header { padding: 23px 0 17px; }
  .quiz { padding-top: 17px; }
  .practice-progress { grid-template-columns: 1fr; padding-block: 13px; }
  .learning-progress { padding: 0 0 13px; }
  .round-progress { padding: 13px 0 0; border-left: 0; border-top: 1px solid var(--rule); }
  .response > button { width: 100%; }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <p class="course">EE2 · Modelamiento Predictivo de Datos</p>
      <h1>Práctica por rondas</h1>
    </div>
    <div class="header-actions">
      <div class="bank-picker" role="group" aria-label="Elegir balotario">
        <button type="button" data-bank="general" aria-pressed="false">General</button>
        <button type="button" data-bank="profesor" aria-pressed="false">Profesor</button>
      </div>
      <button class="account-link" type="button" id="account-entry" hidden>Entrar</button>
      <span class="account-sync" id="account-sync" role="status" hidden></span>
    </div>
  </header>
  <main>
    <div id="practice-page">
      <div class="practice-progress">
        <section class="progress-group learning-progress" aria-labelledby="learning-label">
          <div class="metric-line">
            <strong id="learning-label">Aprendizaje</strong>
            <span id="progress-label"></span>
          </div>
          <div class="progress-track">
            <progress id="learning-progress" aria-label="Preguntas acertadas de todo el cuestionario"></progress>
            <span class="progress-fill" id="learning-fill" aria-hidden="true"></span>
          </div>
        </section>
        <section class="progress-group round-progress" aria-labelledby="round-label">
          <div class="metric-line">
            <strong id="round-label"></strong>
            <span id="round-progress-label"></span>
          </div>
          <div class="progress-track">
            <progress id="progress" aria-label="Preguntas respondidas en esta ronda"></progress>
            <span class="progress-fill round-correct" id="progress-fill" aria-hidden="true"></span>
            <span class="progress-fill round-incorrect" id="incorrect-fill" aria-hidden="true"></span>
          </div>
          <div class="round-breakdown">
            <span id="correct-label"></span>
            <span id="incorrect-label"></span>
          </div>
        </section>
      </div>
      <div class="quiz">
        <div class="question-toolbar" id="question-toolbar">
          <div class="question-position">
            <button class="previous-question" id="previous-question" type="button" aria-label="Pregunta anterior" title="Pregunta anterior" hidden>←</button>
            <p class="step" id="question-step"></p>
          </div>
          <a class="learn-link" id="learn-link" href="#">Aprender más</a>
        </div>
        <section id="panel" aria-labelledby="question-title"></section>
      </div>
    </div>
    <article class="study-page" id="study-page" aria-labelledby="study-title" hidden></article>
    <noscript>Activa JavaScript en el navegador para usar el cuestionario.</noscript>
  </main>
</div>
<dialog class="account-dialog" id="account-dialog" aria-labelledby="account-title">
  <div class="account-dialog-head">
    <h2 id="account-title">Iniciar sesión</h2>
    <button class="account-link" id="account-close" type="button">Cerrar</button>
  </div>
  <p id="account-description"></p>
  <form class="account-form" id="account-form" hidden>
    <label>Correo electrónico <input id="account-email" type="email" required autocomplete="email" maxlength="254"></label>
    <label id="account-password-row">Contraseña <input id="account-password" type="password" required autocomplete="current-password" maxlength="128"></label>

<script>
'use strict';

const banks = {
  general: makeBank('general', 'General', 'question-bank', 'mpd-ee2-practica-v1'),
  profesor: makeBank('profesor', 'Profesor', 'profesor-bank', 'mpd-ee2-practica-profesor-v1'),
};
const preferenceKey = 'mpd-ee2-balotario-v1';
const guestSessions = new Map();
let sessions = guestSessions;
let saveAccountProgress = null;
const bankButtons = [...document.querySelectorAll('[data-bank]')];
const panel = document.getElementById('panel');
const practicePage = document.getElementById('practice-page');
const studyPage = document.getElementById('study-page');
const bankPicker = document.querySelector('.bank-picker');
const learnLink = document.getElementById('learn-link');
const previousButton = document.getElementById('previous-question');
const progress = document.getElementById('progress');
let activeBank;
let session;

function makeBank(id, label, elementId, storageKey) {
  const questions = JSON.parse(document.getElementById(elementId).textContent);
  return {
    id,
    label,
    questions,
    storageKey,
    byId: new Map(questions.map(question => [question.id, question])),
  };
}

function freshSession(ids = activeBank.questions.map(question => question.id), round = 1) {
  return { round, ids: [...ids], cursor: 0, answers: [], draft: [] };
}

function preferredBank() {
  try {
    const name = localStorage.getItem(preferenceKey);
    if (Object.hasOwn(banks, name)) return name;
  } catch {
    // The bank selector works in memory without browser storage.
  }
  return 'general';
}

function selectBank(name) {
  const bank = banks[name];
  if (activeBank === bank) return;
  activeBank = bank;
  session = sessions.get(bank) ?? restoreSession();
  sessions.set(bank, session);
  try {
    localStorage.setItem(preferenceKey, name);
  } catch {
    // The current selection is still available in memory.
  }
  bankButtons.forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.bank === name));
  });
  render();
}

function validSelection(bank, id, selected) {
  const question = bank.byId.get(id);
  return Boolean(question && Array.isArray(selected) &&
    selected.length > 0 &&
    (question.correct.length > 1 || selected.length <= 1) &&
    new Set(selected).size === selected.length &&
    selected.every(value => question.options.some(option => option.key === value)));
}

function validateSession(bank, saved) {
  if (saved && Number.isInteger(saved.round) && saved.round >= 1 &&
      Array.isArray(saved.ids) && saved.ids.length &&
      new Set(saved.ids).size === saved.ids.length && saved.ids.every(id => bank.byId.has(id)) &&
      Number.isInteger(saved.cursor) && saved.cursor >= 0 && saved.cursor <= saved.ids.length &&
      Array.isArray(saved.answers) && saved.answers.length >= saved.cursor &&
      saved.answers.length <= Math.min(saved.cursor + 1, saved.ids.length) &&
      saved.answers.every((answer, index) => validSelection(bank, saved.ids[index], answer)) &&
      Array.isArray(saved.draft) &&
      (saved.draft.length === 0 || validSelection(bank, saved.ids[saved.cursor], saved.draft))) {
    const { round, ids, cursor, answers, draft, reviewCursor } = saved;
    const result = { round, ids, cursor, answers, draft };
    if (Number.isInteger(reviewCursor) && reviewCursor >= 0 &&
        reviewCursor < cursor && cursor < ids.length) {
      result.reviewCursor = reviewCursor;
    }
    return result;
  }
  return null;
}

function readGuestSession(bank) {
  try {
    return validateSession(bank, JSON.parse(localStorage.getItem(bank.storageKey)));
  } catch {
    return null;
  }
}

function restoreSession() {
  return (sessions === guestSessions && readGuestSession(activeBank)) || freshSession();
}

function persist(sync = true) {
  sessions.set(activeBank, session);
  if (saveAccountProgress) {
    if (sync) saveAccountProgress(activeBank.id, snapshot(session));
    return;
  }
  try {
    localStorage.setItem(activeBank.storageKey, JSON.stringify(session));
  } catch {
    // The active round is still available in memory.
  }
}

function snapshot({ round, ids, cursor, answers }) {
  return JSON.stringify({ round, ids, cursor, answers, draft: [] });
}

function replaceActiveSession() {
  session = sessions.get(activeBank) ?? restoreSession();
  sessions.set(activeBank, session);
  render();
  showPage();
}

const quizProgress = {
  guest(id) {
    const bank = banks[id];
    const saved = guestSessions.get(bank) ?? readGuestSession(bank);
    return saved && (saved.round > 1 || saved.answers.length) ? snapshot(saved) : null;
  },
  decode(id, text) {
    try {
      return validateSession(banks[id], JSON.parse(text));
    } catch {
      return null;
    }
  },
  enter(values, save) {
    sessions = new Map();
    for (const [id, value] of values) if (value) sessions.set(banks[id], value);
    saveAccountProgress = save;
    replaceActiveSession();
  },
  replace(id, value) {
    const bank = banks[id];
    if (value) sessions.set(bank, value);
    else sessions.delete(bank);
    if (bank === activeBank) replaceActiveSession();
  },
  leave() {
    if (sessions === guestSessions) return;
    sessions = guestSessions;
    saveAccountProgress = null;
    replaceActiveSession();
  },
};

function isCorrect(question, selected) {
  return Boolean(selected && selected.length === question.correct.length &&
    question.correct.every(key => selected.includes(key)));
}

function setProgress(bar, value, total) {
  bar.max = total;
  bar.value = value;
}

function setFill(id, value, total) {
  document.getElementById(id).style.width = (value / total * 100) + '%';
}

function displayedQuestionIndex() {
  return session.reviewCursor ?? session.cursor;
}

function updateProgress() {
  const roundSize = session.ids.length;
  const answered = session.answers.length;
  const correct = session.answers.filter((answer, index) =>
    isCorrect(activeBank.byId.get(session.ids[index]), answer)).length;
  const incorrect = answered - correct;
  const total = activeBank.questions.length;
  const mastered = total - roundSize + correct;
  const complete = session.cursor === roundSize;

  document.getElementById('progress-label').textContent = mastered + ' de ' + total + ' acertadas';
  setProgress(document.getElementById('learning-progress'), mastered, total);
  setFill('learning-fill', mastered, total);

  document.getElementById('round-label').textContent = 'Ronda ' + session.round;
  document.getElementById('round-progress-label').textContent = answered + ' de ' + roundSize +
    (roundSize === 1 ? ' respondida' : ' respondidas');
  document.getElementById('correct-label').textContent = correct + (correct === 1 ? ' acierto' : ' aciertos');
  document.getElementById('incorrect-label').textContent = incorrect + (incorrect === 1 ? ' error' : ' errores');
  setProgress(progress, answered, roundSize);
  setFill('progress-fill', correct, roundSize);
  setFill('incorrect-fill', incorrect, roundSize);

  const step = document.getElementById('question-step');
  const index = displayedQuestionIndex();
  document.getElementById('question-toolbar').hidden = complete;
  previousButton.hidden = complete || index === 0;
  step.textContent = complete ? '' : 'Pregunta ' + (index + 1) + ' de ' + roundSize;
  if (!complete) learnLink.href = '#aprender/' + activeBank.id + '/' + session.ids[index];
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function title(text) {
  const node = element('h2', '', text);
  node.id = 'question-title';
  node.tabIndex = -1;
  return node;
}

function renderQuestion(focusTarget) {
  const index = displayedQuestionIndex();
  const question = activeBank.byId.get(session.ids[index]);
  const answer = session.answers[index];
  const multiple = question.correct.length > 1;
  const selected = answer ?? session.draft;
  const correct = isCorrect(question, answer);
  const heading = title(question.explanation.enunciadoClaro ?? question.text);
  const form = element('form');
  const options = element('fieldset');
  options.setAttribute('aria-labelledby', heading.id);
  options.disabled = Boolean(answer);

  if (question.examples.length) {
    const list = element('ol', 'context');
    question.examples.forEach(example => list.append(element('li', '', example)));
    form.append(list);
  }
  if (multiple) form.append(element('p', 'hint', 'Marca todas las opciones correctas.'));

  question.options.forEach(option => {
    const row = element('label', 'option');
    const input = element('input');
    input.type = multiple ? 'checkbox' : 'radio';
    input.name = 'answer';
    input.value = option.key;
    input.checked = selected.includes(option.key);
    const label = element('span');
    if (option.key !== 'V' && option.key !== 'F') {
      label.append(element('span', 'letter', option.key + '.'));
    }
    label.append(option.text);
    if (answer && question.correct.includes(option.key)) row.classList.add('is-correct');
    if (answer && input.checked && !question.correct.includes(option.key)) row.classList.add('is-wrong');
    row.append(input, label);
    options.append(row);
  });

  const actions = element('div', 'response');
  const button = element('button', '', answer
    ? (index === session.ids.length - 1 ? 'Ver resultado de la ronda' : 'Siguiente pregunta')
    : 'Comprobar respuesta');
  button.type = 'submit';
  button.disabled = !selected.length;

  let feedback;
  if (answer) {
    feedback = element('div', 'feedback ' + (correct ? 'good' : 'bad'));
    feedback.tabIndex = -1;
    const feedbackTitle = element('div', 'feedback-title');
    const icon = element('span', 'feedback-icon', correct ? '✓' : '×');
    icon.setAttribute('aria-hidden', 'true');
    feedbackTitle.append(icon, element('strong', '', correct ? 'Correcto' : 'Incorrecto'));
    feedback.append(feedbackTitle);
    if (focusTarget === 'feedback') feedback.classList.add('feedback-enter');
    if (!correct) {
      const correctOptions = question.options
        .filter(option => question.correct.includes(option.key))
        .map(option => multiple ? option.key + '. ' + option.text : option.text);
      const label = multiple ? 'Respuestas correctas' : 'Respuesta correcta';
      feedback.append(element('p', '', label + ': ' + correctOptions.join(' / ')));
      const explanation = element('p', 'explanation');
      explanation.append(element('b', '', 'Por qué: '), question.explanation.texto);
      feedback.append(explanation);
      if (question.explanation.fuente) {
        const source = element('a', '', 'Ver fuente');
        source.href = question.explanation.fuente;
        source.target = '_blank';
        source.rel = 'noopener noreferrer';
        feedback.append(source);
      }
    } else if (question.note) {
      feedback.append(element('p', '', question.note));
    }
    actions.append(feedback);
  }

  actions.append(button);
  form.append(options, actions);
  options.addEventListener('change', () => {
    session.draft = [...options.querySelectorAll('input:checked')].map(input => input.value);
    button.disabled = !session.draft.length;
    persist(false);
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (index < session.cursor) {
      if (index + 1 === session.cursor) delete session.reviewCursor;
      else session.reviewCursor = index + 1;
      persist(false);
      render('heading');
      return;
    }
    if (answer) {
      session.cursor += 1;
      persist();
      render(session.cursor === session.ids.length ? 'round-result' : 'heading');
    } else if (session.draft.length) {
      session.answers.push([...session.draft]);
      session.draft = [];
      persist();
      render('feedback');
    }
  });

  if (focusTarget === 'heading') {
    heading.classList.add('question-enter');
    form.classList.add('question-enter');
  }
  panel.classList.remove('summary', 'completion-summary');
  panel.replaceChildren(heading, form);
  if (focusTarget === 'feedback') feedback?.focus();
  if (focusTarget === 'heading') heading.focus();
}

function completionMark(celebrate) {
  const mark = element('div', 'completion-mark' + (celebrate ? ' celebrating' : ''));
  mark.setAttribute('aria-hidden', 'true');
  mark.append(element('span', 'completion-check', '✓'));
  if (!celebrate) return mark;

  const sparks = [
    [-34, -22, -45, '#438b75'], [-14, -36, 32, '#bc873e'],
    [12, -38, -25, '#d18a73'], [36, -25, 55, '#438b75'],
    [45, -3, 80, '#bc873e'], [37, 22, 45, '#d18a73'],
    [-24, 25, -36, '#bc873e'], [-37, 4, 30, '#438b75'],
  ];
  for (const [x, y, turn, color] of sparks) {
    const spark = element('span', 'completion-spark');
    spark.style.setProperty('--spark-x', x + 'px');
    spark.style.setProperty('--spark-y', y + 'px');
    spark.style.setProperty('--spark-turn', turn + 'deg');
    spark.style.setProperty('--spark-color', color);
    mark.append(spark);
  }
  return mark;
}

function renderCompletion(focusTarget) {
  const total = activeBank.questions.length;
  const heading = title('¡Lo lograste!');
  const description = element('p', '', session.round === 1
    ? 'Acertaste las ' + total + ' preguntas en una sola ronda.'
    : 'Acertaste las ' + total + ' preguntas y resolviste todas las que te quedaban por repasar.');
  const actions = element('div', 'completion-actions');
  const replay = element('button', '', 'Practicar las ' + total + ' preguntas otra vez');
  replay.type = 'button';
  replay.addEventListener('click', () => {
    session = freshSession();
    persist();
    render('heading');
  });
  actions.append(replay);

  panel.classList.add('summary', 'completion-summary');
  panel.replaceChildren(completionMark(focusTarget === 'round-result'), heading, description);
  if (session.replayDismissed !== true) {
    const invitation = element('p', 'completion-question',
      '¿Te gustaría intentarlas todas otra vez y ver si puedes acertarlas en una sola ronda?');
    const finish = element('button', 'quiet-button', 'Terminar por ahora');
    finish.type = 'button';
    finish.addEventListener('click', () => {
      session.replayDismissed = true;
      persist();
      render('heading');
    });
    actions.append(finish);
    panel.append(invitation);
  } else {
    panel.append(element('p', 'completion-question', 'Puedes volver a practicar cuando quieras.'));
  }
  panel.append(actions);
  if (focusTarget) heading.focus();
}

function renderSummary(focusTarget) {
  const wrong = session.ids.filter((id, index) =>
    !isCorrect(activeBank.byId.get(id), session.answers[index]));
  if (!wrong.length) {
    renderCompletion(focusTarget);
    return;
  }

  const heading = title('Ronda terminada');
  const description = element('p', '',
    'En la siguiente ronda practicarás únicamente las preguntas que acabas de fallar.');
  const button = element('button', '', 'Empezar ronda ' + (session.round + 1));
  button.type = 'button';
  button.addEventListener('click', () => {
    session = freshSession(wrong, session.round + 1);
    persist();
    render('heading');
  });
  panel.classList.add('summary');
  panel.classList.remove('completion-summary');
  panel.replaceChildren(heading, description, button);
  if (focusTarget) heading.focus();
}

function render(focusTarget) {
  updateProgress();
  if (session.cursor === session.ids.length) renderSummary(focusTarget);
  else renderQuestion(focusTarget);
}

function studyTable(visual) {
  const table = element('table', 'study-table');
  table.setAttribute('aria-label', visual.titulo);
  const headers = element('tr');
  for (const column of visual.columnas) {
    const cell = element('th', '', column);
    cell.scope = 'col';
    headers.append(cell);
  }
  const head = element('thead');
  head.append(headers);
  const body = element('tbody');
  for (const values of visual.filas) {
    const row = element('tr');
    values.forEach((value, index) => {
      const rowHeader = index === 0 && !visual.sinCabeceraFila;
      const cell = element(rowHeader ? 'th' : 'td', '', value);
      if (rowHeader) cell.scope = 'row';
      row.append(cell);
    });
    body.append(row);
  }
  table.append(head, body);
  return table;
}

function studyChart(visual) {
  const canvas = element('canvas', 'study-chart', visual.nota);
  canvas.width = 880;
  canvas.height = 468;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', visual.titulo + '. ' + visual.nota);
  const ctx = canvas.getContext('2d');
  if (!ctx) return canvas;
  ctx.scale(2, 2);
  const [left, right, top, bottom] = [47, 423, 27, 184];
  const xMin = visual.marcasX[0];
  const xMax = visual.marcasX.at(-1);
  const yMin = visual.marcasY[0];
  const yMax = visual.marcasY.at(-1);
  const plotX = value => left + (value - xMin) / (xMax - xMin) * (right - left);
  const plotY = value => bottom - (value - yMin) / (yMax - yMin) * (bottom - top);
  const number = new Intl.NumberFormat('es-PE');
  ctx.font = '15px Segoe UI, sans-serif';
  ctx.fillStyle = '#46524f';
  ctx.strokeStyle = '#d7e4e0';
  for (const y of visual.marcasY) {
    const level = plotY(y);
    ctx.beginPath();
    ctx.moveTo(left, level);
    ctx.lineTo(right, level);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillText(number.format(y), left - 6, level + 5);
  }
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, bottom);
  ctx.lineTo(right, bottom);
  ctx.strokeStyle = '#889b96';
  ctx.stroke();
  ctx.textAlign = 'center';
  for (const x of visual.marcasX) ctx.fillText(number.format(x), plotX(x), bottom + 20);
  ctx.fillText(visual.ejeX, (left + right) / 2, bottom + 42);
  ctx.textAlign = 'left';
  ctx.fillText(visual.ejeY, 5, 16);

  ctx.strokeStyle = '#23675e';
  ctx.lineWidth = 2.5;
  if (visual.estilo === 'dispersion') {
    ctx.fillStyle = '#23675e';
    for (const [x, y] of visual.puntos) {
      ctx.beginPath();
      ctx.arc(plotX(x), plotY(y), 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.beginPath();
    visual.puntos.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(plotX(x), plotY(y));
      else ctx.lineTo(plotX(x), plotY(y));
    });
    ctx.stroke();
  }
  if (visual.destacado !== undefined) {
    const point = visual.puntos.find(([x]) => x === visual.destacado);
    const x = plotX(point[0]);
    const y = plotY(point[1]);
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#a26042';
    ctx.lineWidth = 1.2;
    ctx.moveTo(x, y);
    ctx.lineTo(x, bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#a26042';
    ctx.fill();
  }
  return canvas;
}

function studySteps(visual) {
  const list = element('ol', 'study-steps');
  list.style.setProperty('--step-count', visual.pasos.length);
  visual.pasos.forEach(step => list.append(element('li', '', step)));
  return list;
}

function studyMap(visual) {
  const map = element('div', 'study-map');
  const branches = element('ul', 'map-branches');
  branches.style.setProperty('--branch-count', visual.ramas.length);
  for (const branch of visual.ramas) {
    const node = element('li');
    node.append(element('strong', '', branch.etiqueta), element('span', '', branch.detalle));
    branches.append(node);
  }
  map.append(element('strong', 'map-root', visual.centro), branches);
  return map;
}

function studyBars(visual) {
  const chart = element('div', 'study-bars');
  const max = visual.unidad === '%' ? 100 : Math.max(...visual.barras.map(bar => bar.valor));
  for (const bar of visual.barras) {
    const row = element('div', 'study-bar-row');
    const track = element('div', 'study-bar-track');
    const fill = element('span', 'study-bar-fill');
    track.setAttribute('aria-hidden', 'true');
    fill.style.width = (bar.valor / max * 100) + '%';
    track.append(fill);
    row.append(element('span', '', bar.etiqueta), track, element('strong', '', bar.texto));
    chart.append(row);
  }
  return chart;
}

function studyNumberline(visual) {
  const line = element('ol', 'study-numberline');
  const min = visual.marcas[0].valor;
  const max = visual.marcas.at(-1).valor;
  for (const point of visual.marcas) {
    const marker = element('li');
    marker.style.left = ((point.valor - min) / (max - min) * 100) + '%';
    marker.append(element('strong', '', String(point.valor)), element('span', '', point.etiqueta));
    line.append(marker);
  }
  return line;
}

function studyVisual(visual) {
  const renderers = {
    pasos: studySteps, mapa: studyMap, barras: studyBars, recta: studyNumberline, grafica: studyChart,
  };
  const figure = element('figure', 'study-figure');
  figure.append(element('strong', 'figure-title', visual.titulo), renderers[visual.tipo](visual));
  if (visual.nota) figure.append(element('figcaption', '', visual.nota));
  return figure;
}

function studyTableSupport(visual) {
  const section = element('section', 'study-table-support');
  section.append(element('h3', '', visual.titulo), studyTable(visual));
  if (visual.nota) section.append(element('p', '', visual.nota));
  return section;
}

function showPage(moveFocus = false) {
  const match = /^#aprender\/(general|profesor)\/([1-9]\d*)$/.exec(location.hash);
  const bank = match ? banks[match[1]] : null;
  const question = bank?.byId.get(Number(match[2]));
  const wasStudying = !studyPage.hidden;
  practicePage.hidden = Boolean(question);
  bankPicker.hidden = Boolean(question);
  studyPage.hidden = !question;
  if (!question) {
    if (moveFocus && wasStudying) {
      const focus = document.getElementById('question-toolbar').hidden
        ? panel.querySelector('h2') : learnLink;
      focus?.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
    return;
  }

  const sameQuestion = bank === activeBank && question.id === session.ids[displayedQuestionIndex()];
  const back = element('a', 'study-back', sameQuestion ? 'Volver a la pregunta' : 'Volver al cuestionario');
  back.href = '#';
  const guide = question.studyGuide;
  const label = element('p', 'study-meta', 'Aprender más · ' + bank.label + ' · Pregunta ' + question.id);
  const heading = element('h2', '', guide.titulo);
  heading.id = 'study-title';
  heading.tabIndex = -1;
  const insight = element('p', 'study-insight', guide.idea);
  studyPage.replaceChildren(back, label, heading, insight, studyVisual(guide.visual));
  if (guide.siglas) studyPage.append(element('p', 'study-glossary', guide.siglas));
  if (question.explanation.enunciadoClaro) {
    const original = element('div', 'study-original');
    original.append(element('strong', '', 'Enunciado original'), element('p', '', question.text));
    studyPage.append(original);
  }
  const source = guide.fuente ?? question.explanation.fuente;
  if (source) {
    const link = element('a', 'study-source', 'Ver fuente');
    link.href = source;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    studyPage.append(link);
  }
  if (guide.tabla) studyPage.append(studyTableSupport(guide.tabla));
  if (moveFocus) {
    heading.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

previousButton.addEventListener('click', () => {
  const index = displayedQuestionIndex();
  if (index === 0 || session.cursor === session.ids.length) return;
  session.reviewCursor = index - 1;
  persist(false);
  render('heading');
});

bankButtons.forEach(button => {
  const name = button.dataset.bank;
  button.textContent += ' (' + banks[name].questions.length + ')';
  button.addEventListener('click', () => selectBank(name));
});
selectBank(preferredBank());
showPage();
window.addEventListener('hashchange', () => showPage(true));
if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  import('./quiz-account.js').then(({ connectAccounts }) => connectAccounts(quizProgress))
    .catch(error => console.warn('El acceso a cuentas no está disponible.', error.code ?? error.name));
}
</script>
